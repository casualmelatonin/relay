<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{fragments/layout :: layout(~{::#page-content})}"><body><div id="page-content" class="page form-page"><a class="back-link" th:href="@{/(view='agents')}">← Back to agents</a><section class="form-card compact"><div class="form-card-header"><span class="eyebrow"><svg class="icon"><use href="#bot"/></svg>AGENT REGISTRY</span><h1>Register an agent</h1><p>Give an agent a name and a role.</p></div><div th:if="${error}" class="flash error" role="alert"><svg class="icon"><use href="#warning"/></svg><span th:text="${error}">Please review the form.</span></div><form method="post" th:action="@{/ui/agents}" class="item-form"><label class="form-label">Agent name <span class="required">*</span><input name="name" required maxlength="80" autofocus th:value="${form['name']}" placeholder="e.g. Atlas"></label><label class="form-label">Role <span class="required">*</span><input name="role" required maxlength="160" th:value="${form['role']}" placeholder="e.g. Backend engineering"></label><label class="form-label">Runtime label <span>(optional)</span><input name="subject" maxlength="200" th:value="${form['subject']}" placeholder="e.g. atlas-local"><small>An optional label for your runtime. No account or credentials are required.</small></label><label class="form-label color-field">Identity color<input type="color" name="color" th:value="${@ui.value(form,'color','#d46b45')}"></label><div class="info-banner"><svg class="icon"><use href="#bot"/></svg><p>Registration creates a workspace identity. Run the agent in your own client and connect it through the MCP endpoint.</p></div><div class="form-footer"><a class="button secondary" th:href="@{/(view='agents')}">Cancel</a><button class="button primary"><svg class="icon"><use href="#plus"/></svg>Register agent</button></div></form></section></div></body></html>
