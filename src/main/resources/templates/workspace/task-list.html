<html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="taskList" class="table-scroll">
<table class="task-table"><thead><tr><th scope="col">Task</th><th scope="col">Status</th><th scope="col">Owner</th><th scope="col">Priority</th><th scope="col">Updated</th><th scope="col"><span class="sr-only">Open task</span></th></tr></thead>
<tbody><tr th:each="item : ${filtered}">
<td><a class="task-title" th:href="@{/items/{id}(id=${item.id})}"><span class="item-type-icon"><svg class="icon"><use href="#checklist"/></svg></span><span><span class="task-key" th:text="${item.key}">RLY-1</span><strong th:text="${item.title}">Task title</strong><small class="blocker-text" th:if="${!@ui.blockers(item,itemsById).isEmpty()}" th:text="${'Waiting on ' + @ui.blockers(item,itemsById).get(0).key}">Waiting on a prerequisite</small><small class="task-parent" th:if="${item.parentId != null and itemsById.containsKey(item.parentId) and @ui.blockers(item,itemsById).isEmpty()}" th:text="${itemsById[item.parentId].title}">Parent epic</small></span></a></td>
<td><span class="status-badge" th:classappend="${@ui.css(item.status)}"><i></i><span th:text="${@ui.label(item.status)}">Ready</span></span></td>
<td><span class="owner"><span class="avatar small" th:text="${@ui.agentInitials(item.assigneeId,agentsById)}">AT</span><span th:text="${@ui.agentName(item.assigneeId,agentsById)}">Unassigned</span></span></td>
<td><span class="priority" th:classappend="${@ui.css(item.priority)}"><span th:text="${item.priority.name() == 'URGENT' ? '⚑' : (item.priority.name() == 'HIGH' ? '↑' : '−')}"></span><span th:text="${@ui.label(item.priority)}">Medium</span></span></td>
<td class="muted nowrap" th:text="${@ui.ago(item.updatedAt)}">now</td><td><a class="row-open" th:href="@{/items/{id}(id=${item.id})}" th:aria-label="${'Open ' + item.key}">→</a></td>
</tr><tr th:if="${filtered.isEmpty()}"><td colspan="6"><div class="empty-state"><span class="empty-icon"><svg class="icon"><use href="#checklist"/></svg></span><h3>No tasks in this view</h3><p>Try removing a filter or create a task for your team.</p><a class="button secondary" th:href="@{/items/new}" th:if="${admin}">Create a task</a></div></td></tr></tbody></table>
</div></body></html>
