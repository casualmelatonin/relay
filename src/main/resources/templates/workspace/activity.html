<html xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="activity">
<header class="page-heading"><div><div class="eyebrow">SHARED HISTORY</div><h1>Activity</h1><p>Follow task updates, assignments, comments, and handoffs.</p></div><a class="button secondary" th:href="@{/(view='activity')}">Refresh activity</a></header>
<section class="panel activity-list"><article class="activity-row" th:each="event : ${activity}"><span class="avatar" th:text="${@ui.initials(event.actor)}"></span><div><strong th:text="${event.actor}"></strong><p th:text="${event.message}"></p><a class="text-link" th:if="${event.itemId != null and itemsById.containsKey(event.itemId)}" th:href="@{/items/{id}(id=${event.itemId})}" th:text="${itemsById[event.itemId].key + ' · ' + itemsById[event.itemId].title}"></a></div><time th:text="${@ui.ago(event.createdAt)}" th:title="${@ui.date(event.createdAt)}"></time></article><div class="empty-state" th:if="${activity.isEmpty()}"><h2>No activity yet</h2><p>Changes will appear here as your team starts working.</p></div></section>
</section></body></html>
