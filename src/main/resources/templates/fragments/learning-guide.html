<html xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="guide" class="learning-guide" th:if="${@ui.work(selected)}">
<div class="chunk-steps"><b>1 Understand</b><span>→</span><b>2 Plan</b><span>→</span><b>3 Build</b><span>→</span><b>4 Review</b></div>
<h2>Understand this chunk before you build it</h2><p>Keep the scope small. Use your AI assistant to explain the approach, then review the result together.</p>
<form method="post" th:action="@{/ui/items/{id}/guide(id=${selected.id})}"><input type="hidden" name="version" th:value="${guide.version}">
<div class="form-grid"><label class="form-label">Why does this chunk matter?<textarea name="purpose" rows="3" maxlength="8000" th:text="${guide.purpose}" placeholder="Explain how this step moves the project forward."></textarea></label><label class="form-label">What should I understand afterward?<textarea name="learningGoal" rows="3" maxlength="8000" th:text="${guide.learningGoal}" placeholder="Name the concept, design choice, or part of the system you will learn."></textarea></label></div>
<label class="form-label">Small implementation steps<textarea name="steps" rows="5" maxlength="8000" th:text="${guide.steps}" placeholder="1. Read the relevant code and explain the approach.&#10;2. Implement one focused change.&#10;3. Run the check that proves it works."></textarea><small>One step per line. Avoid bundling unrelated changes into this chunk.</small></label>
<details><summary>After building: record what you learned</summary><label class="form-label">Review notes<textarea name="reflection" rows="3" maxlength="8000" th:text="${guide.reflection}" placeholder="What changed? Why was this approach chosen? What can you now explain? What should the next chunk know?"></textarea></label></details>
<div class="form-footer" th:if="${admin}"><span>This guide supports the developer’s learning and review.</span><button class="button secondary small">Save learning guide</button></div></form>
</section></body></html>
